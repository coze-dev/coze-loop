name: License Check

on:
  push:
    branches: ['main', "release/**"]
  pull_request:
    branches: ['main', "release/**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Newer than both backend/go.mod and license-eye's own requirement, so
          # no toolchain has to be downloaded at run time.
          go-version: '1.25.3'
          cache-dependency-path: backend/go.sum

      - name: Install license-eye
        run: |
          go install github.com/apache/skywalking-eyes/cmd/license-eye@v0.9.0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: License Header Check
        run: |
          license-eye header check -c .github/.licenserc.yaml

      - name: License Dependency Check
        run: |
          license-eye dependency check -c .github/.licenserc.yaml

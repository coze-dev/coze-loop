name: CI@backend

on:
  push:
    branches: ["main", "release/**"]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yaml'
  pull_request:
    branches: ["main", "release/**"]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  golang-lint:
    name: Golang CI Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      - name: Golang Lint
        # https://golangci-lint.run/
        run: |
          # Install golangci-lint
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.2.1

          # Add golangci-lint to PATH
          export PATH=$PATH:$(go env GOPATH)/bin

          # Run golangci-lint
          golangci-lint run --config ../.github/.golangci.yaml

  build-and-unittest:
    name: Build and Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: cozeloop
          MYSQL_PASSWORD: cozeloop
          MYSQL_DATABASE: expt_running_retry_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ucozeloop -pcozeloop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.2.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      # Service containers start before checkout, so the init SQL (which lives
      # in the repository) is applied here instead of via initdb.d.
      - name: Initialize MySQL schema
        run: |
          set -euo pipefail
          loaded=0
          for f in ../release/deployment/docker-compose/bootstrap/mysql-init/init-sql/*.sql; do
            docker exec -i -e MYSQL_PWD=cozeloop "${{ job.services.mysql.id }}" \
              mysql --protocol=TCP -h 127.0.0.1 -ucozeloop expt_running_retry_test < "$f"
            loaded=$((loaded + 1))
          done
          echo "initialized ${loaded} schema files in expt_running_retry_test"
          # Lock-observation tests read performance_schema.data_locks, which the
          # application user cannot see without an explicit read grant.
          docker exec -i -e MYSQL_PWD=root "${{ job.services.mysql.id }}" \
            mysql --protocol=TCP -h 127.0.0.1 -uroot \
            -e "GRANT SELECT ON performance_schema.* TO 'cozeloop'@'%'; FLUSH PRIVILEGES;"

      - name: Build
        run: go build -v ./...

      - name: Run Unit Tests
        env:
          EXPT_RETRY_MYSQL_DSN: "cozeloop:cozeloop@tcp(127.0.0.1:3306)/expt_running_retry_test?charset=utf8mb4&parseTime=True&loc=Local"
          EXPT_RETRY_REAL_REDIS_ADDR: "127.0.0.1:6379"
        run: |
          go test -gcflags="all=-N -l" -race -v -timeout 45m -coverprofile=coverage.out -coverpkg=./... ./...

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
